name: MapLov validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: maplov-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Reject tracked local/generated files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(local [0-9]+\.properties|Generated [0-9]+\.xcconfig|flutter_export_environment [0-9]+\.sh|\.flutter-plugins-dependencies [0-9]+)$'; then
            echo "Generated or machine-local files are tracked."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release-mode Android App Bundle
        run: flutter build appbundle --release
